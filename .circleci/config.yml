version: 2.1

orbs:
  node: circleci/node@7.1.1

executors:
  node:
    docker:
      - image: cimg/node:22.18.0

commands:
  bootstrap:
    description: "Install dependencies"
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          override-ci-command: npm ci --legacy-peer-deps

workflows:
  build:
    jobs:
      - build:
          filters:
            branches:
              ignore:
                - master # upstream repo
                - fork   # our 'main' branch
  deploy:
    jobs:
      - publish:
          context:
            - npm-publish
          filters:
            branches:
              only:
                - fork

jobs:
  build:
    executor: node
    steps:
      - bootstrap
      - run:
          name: Build
          command: npm run build

  # Not running tests because they don't even pass on the upstream repo
  # test:

  publish:
    executor: node
    steps:
      - bootstrap
      - run:
          name: Check if version is already published
          command: |
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            PACKAGE_NAME=$(node -p "require('./package.json').name")

            echo "Checking if ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published..."

            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "Version ${PACKAGE_VERSION} is already published. Skipping publish."
              circleci-agent step halt
            else
              echo "Version ${PACKAGE_VERSION} not found on npm. Proceeding with publish."
            fi
      - run:
          name: Build
          command: npm run build
      - run:
          name: Publish to npm
          command: npm publish
